<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chord Transposer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e88e5">
</head>
<body>

  <div class="container">
    <h2>🎹 Chord Transposer</h2>

    <textarea id="inputText" placeholder="Paste song here..."></textarea>

    <select id="toKey">
  <optgroup label="Major Keys">
    <option value="C">C</option>
    <option value="C#">C#</option>
    <option value="D">D</option>
    <option value="D#">D#</option>
    <option value="E">E</option>
    <option value="F">F</option>
    <option value="F#">F#</option>
    <option value="G">G</option>
    <option value="G#">G#</option>
    <option value="A">A</option>
    <option value="A#">A#</option>
    <option value="B">B</option>
  </optgroup>

  <optgroup label="Minor Keys">
    <option value="Cm">C minor</option>
    <option value="C#m">C# minor</option>
    <option value="Dm">D minor</option>
    <option value="D#m">D# minor</option>
    <option value="Em">E minor</option>
    <option value="Fm">F minor</option>
    <option value="F#m">F# minor</option>
    <option value="Gm">G minor</option>
    <option value="G#m">G# minor</option>
    <option value="Am">A minor</option>
    <option value="A#m">A# minor</option>
    <option value="Bm">B minor</option>
  </optgroup>
</select>

    <button onclick="transpose()">Transpose</button>
    <button onclick="exportPDF()">Export as PDF</button>

    <p id="detectedKeyInfo" class="detected-key"></p>
    <pre id="outputText"></pre>
    <h3 class="chord-ref-title">Chord Reference</h3>
    <div id="pianoChords"></div>
  </div>

  <script src="app.js"></script>

</body>
</html>
